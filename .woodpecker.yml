steps:
  - name: verify
    image: node:22-bookworm-slim
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends python3 make g++
      - rm -rf /var/lib/apt/lists/*
      - npm ci
      - sh ./scripts/install-rollup-native.sh
      - npm run typecheck
      - npm run build
      - npm test
    when:
      - event: [push, pull_request]

  - name: build-image
    image: docker:27
    privileged: true
    depends_on:
      - verify
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build --pull -t library-of-netheril:latest .
    when:
      - event: push
        branch: main

  - name: deploy
    image: docker:27
    privileged: true
    depends_on:
      - build-image
    environment:
      # Production config lives in the 'prod_dotenv' Woodpecker repo secret
      # (repo settings -> Secrets), not a file on the runner host.
      PROD_DOTENV:
        from_secret: prod_dotenv
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - |-
        if [ -z "$${PROD_DOTENV}" ]; then
          echo "The 'prod_dotenv' secret is missing or empty. Add the production .env contents as a Woodpecker repo secret named prod_dotenv." >&2
          exit 1
        fi
      # Assemble a throwaway deploy dir in the CI workspace; it is discarded
      # when the pipeline ends. The SQLite database lives in a Docker named
      # volume keyed by the -p project name, untouched by this.
      - mkdir -p deploy
      - cp docker-compose.prod.yml deploy/docker-compose.yml
      - printf '%s\n' "$${PROD_DOTENV}" > deploy/.env
      - cd deploy
      - docker compose -p library-of-netheril config >/dev/null
      - APP_IMAGE=library-of-netheril:latest docker compose -p library-of-netheril up -d --force-recreate --no-build --remove-orphans --wait --wait-timeout 120
      - docker image prune -f
    when:
      - event: push
        branch: main
