steps:
  - name: verify
    image: node:22-bookworm-slim
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends python3 make g++
      - rm -rf /var/lib/apt/lists/*
      - npm ci
      - sh ./scripts/install-rollup-native.sh
      - npm run typecheck
      - npm run build
      - npm test
    when:
      - event: [push, pull_request]

  - name: build-image
    image: docker:27
    privileged: true
    depends_on:
      - verify
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build --pull -t library-of-netheril:latest .
    when:
      - event: push
        branch: main

  - name: deploy
    image: docker:27
    privileged: true
    depends_on:
      - build-image
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/krystler/containers/library-of-netheril:/deploy
    commands:
      - mkdir -p /deploy
      - cp docker-compose.prod.yml /deploy/docker-compose.yml
      - cp .env.example /deploy/.env.example
      - |-
        test -f /deploy/.env || {
          echo "Missing /deploy/.env. Copy /deploy/.env.example to /deploy/.env and set production values before deploying." >&2
          exit 1
        }
      - cd /deploy
      - docker compose -p library-of-netheril config >/dev/null
      - APP_IMAGE=library-of-netheril:latest docker compose -p library-of-netheril up -d --force-recreate --no-build --remove-orphans --wait --wait-timeout 120
      - docker image prune -f
    when:
      - event: push
        branch: main
